<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 / 회원가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/font.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- ===================== 로그인 ===================== -->
      <div class="screen active" id="s-login">
        <div class="hd">
          <h1 class="tit">마빈 포트폴리오</h1>
          <p class="txt">가입부터 로그인까지 모든 기능을 구현했습니다.</p>
        </div>

        <div id="login-alert" class="alert"></div>

        <fieldset>
          <legend>아이디</legend>
          <input id="login-id" type="text" placeholder="아이디를 입력해 주세요" autocomplete="username" />
        </fieldset>

        <fieldset>
          <legend>비밀번호</legend>
          <div class="pw-wrap">
            <input id="login-pw" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" />
            <button class="btn-eye" onclick="togglePw('login-pw', this)" aria-label="비밀번호 보기/숨기기">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </fieldset>

        <button class="btn btn--primary" id="login-btn" onclick="doLogin()">로그인</button>

        <nav class="links">
          <button class="btn-link" onclick="show('s-findid')">아이디 찾기</button>
          <button class="btn-link" onclick="show('s-findpw')">비밀번호 찾기</button>
          <button class="btn-link" onclick="show('s-signup')">회원가입</button>
        </nav>

        <div class="divider">SNS 계정으로 로그인</div>

        <div class="sns-list">
          <button class="btn-sns btn-sns--kakao" onclick="socialMsg('kakao')" aria-label="카카오 로그인">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#191600">
              <path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.76 1.733 5.18 4.35 6.6l-1.1 4.1a.3.3 0 0 0 .44.33l4.83-3.2c.48.06.97.1 1.48.1 5.523 0 10-3.477 10-7.8S17.523 3 12 3z" />
            </svg>
          </button>
          <button class="btn-sns btn-sns--google" onclick="socialMsg('google')" aria-label="구글 로그인">
            <svg width="22" height="22" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05" />
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
            </svg>
          </button>
        </div>
      </div>

      <!-- ===================== 회원가입 ===================== -->
      <div class="screen" id="s-signup">
        <button class="btn-back" onclick="show('s-login')">
          <i class="ti ti-arrow-left"></i>
          뒤로
        </button>
        <div class="sub-hd">
          <h2 class="tit">회원가입</h2>
          <p class="txt">아래 정보를 입력하여 계정을 만드세요</p>
        </div>
        <div id="signup-alert" class="alert"></div>
        <fieldset>
          <legend>아이디</legend>
          <input id="su-id" type="text" placeholder="영문/숫자 조합 4자 이상 입력해 주세요" autocomplete="username" />
        </fieldset>
        <fieldset>
          <legend>비밀번호</legend>
          <div class="pw-wrap">
            <input id="su-pw" type="password" placeholder="비밀번호를 입력해 주세요 (8자 이상)" autocomplete="new-password" />
            <button class="btn-eye" onclick="togglePw('su-pw', this)" aria-label="비밀번호 보기/숨기기"><i class="ti ti-eye"></i></button>
          </div>
        </fieldset>
        <fieldset>
          <legend>비밀번호 확인</legend>
          <div class="pw-wrap">
            <input id="su-pw2" type="password" placeholder="비밀번호를 한 번 더 입력해 주세요" autocomplete="new-password" />
            <button class="btn-eye" onclick="togglePw('su-pw2', this)" aria-label="비밀번호 확인 보기/숨기기"><i class="ti ti-eye"></i></button>
          </div>
        </fieldset>
        <fieldset>
          <legend>성함</legend>
          <input id="su-name" type="text" placeholder="실명을 입력해 주세요" autocomplete="name" />
        </fieldset>
        <fieldset>
          <legend>핸드폰번호</legend>
          <div class="verify-row">
            <input id="su-phone" type="tel" placeholder="핸드폰 번호를 입력해 주세요" oninput="formatPhone(this)" autocomplete="tel" />
            <button class="btn-sm" id="su-send-btn" onclick="sendCode('su')">인증번호 받기</button>
          </div>
          <p class="timer" id="su-timer"></p>
        </fieldset>
        <fieldset id="su-code-wrap" style="display: none">
          <legend>인증번호</legend>
          <div class="verify-row">
            <input id="su-code" type="text" placeholder="인증번호 6자리를 입력해 주세요" maxlength="6" autocomplete="one-time-code" />
            <button class="btn-sm" onclick="verifyCode('su')">확인</button>
          </div>
        </fieldset>
        <button class="btn btn--primary" id="su-btn" onclick="doSignup()">가입하기</button>
      </div>

      <!-- ===================== 비밀번호 찾기 ===================== -->
      <div class="screen" id="s-findpw">
        <button class="btn-back" onclick="show('s-login')">
          <i class="ti ti-arrow-left"></i>
          뒤로
        </button>
        <div class="sub-hd">
          <h2 class="tit">비밀번호 찾기</h2>
          <p class="txt">가입 시 등록한 정보로 본인 확인 후 비밀번호를 재설정해요</p>
        </div>
        <div id="findpw-alert" class="alert"></div>
        <fieldset>
          <legend>아이디</legend>
          <input id="fp-id" type="text" placeholder="아이디를 입력해 주세요" />
        </fieldset>
        <fieldset>
          <legend>성함</legend>
          <input id="fp-name" type="text" placeholder="성함을 입력해 주세요" />
        </fieldset>
        <fieldset>
          <legend>핸드폰번호</legend>
          <div class="verify-row">
            <input id="fp-phone" type="tel" placeholder="핸드폰 번호를 입력해 주세요" oninput="formatPhone(this)" />
            <button class="btn-sm" id="fp-send-btn" onclick="sendCode('fp')">인증번호 받기</button>
          </div>
          <p class="timer" id="fp-timer"></p>
        </fieldset>
        <fieldset id="fp-code-wrap" style="display: none">
          <legend>인증번호</legend>
          <div class="verify-row">
            <input id="fp-code" type="text" placeholder="인증번호 6자리를 입력해 주세요" maxlength="6" />
            <button class="btn-sm" onclick="verifyCode('fp')">확인</button>
          </div>
        </fieldset>
        <div id="fp-newpw-section" style="display: none">
          <fieldset>
            <legend>새 비밀번호</legend>
            <div class="pw-wrap">
              <input id="fp-newpw" type="password" placeholder="새 비밀번호를 입력해 주세요 (8자 이상)" />
              <button class="btn-eye" onclick="togglePw('fp-newpw', this)" aria-label="새 비밀번호 보기/숨기기"><i class="ti ti-eye"></i></button>
            </div>
          </fieldset>
          <fieldset>
            <legend>새 비밀번호 확인</legend>
            <div class="pw-wrap">
              <input id="fp-newpw2" type="password" placeholder="새 비밀번호를 재입력해 주세요" />
              <button class="btn-eye" onclick="togglePw('fp-newpw2', this)" aria-label="새 비밀번호 확인 보기/숨기기"><i class="ti ti-eye"></i></button>
            </div>
          </fieldset>
          <button class="btn btn--primary" id="fp-reset-btn" onclick="doResetPw()">비밀번호 변경</button>
        </div>
        <button class="btn btn--primary" id="fp-verify-btn" onclick="doFindPw()">본인 확인</button>
      </div>

      <!-- ===================== 아이디 찾기 ===================== -->
      <div class="screen" id="s-findid">
        <button class="btn-back" onclick="show('s-login')">
          <i class="ti ti-arrow-left"></i>
          뒤로
        </button>
        <div class="sub-hd">
          <h2 class="tit">아이디 찾기</h2>
          <p class="txt">이름과 핸드폰 인증으로 가입한 아이디를 확인해요</p>
        </div>
        <div id="findid-alert" class="alert"></div>
        <fieldset>
          <legend>성함</legend>
          <input id="fi-name" type="text" placeholder="성함을 입력해 주세요" />
        </fieldset>
        <fieldset>
          <legend>핸드폰번호</legend>
          <div class="verify-row">
            <input id="fi-phone" type="tel" placeholder="핸드폰 번호를 입력해 주세요" oninput="formatPhone(this)" />
            <button class="btn-sm" id="fi-send-btn" onclick="sendCode('fi')">인증번호 받기</button>
          </div>
          <p class="timer" id="fi-timer"></p>
        </fieldset>
        <fieldset id="fi-code-wrap" style="display: none">
          <legend>인증번호</legend>
          <div class="verify-row">
            <input id="fi-code" type="text" placeholder="인증번호 6자리를 입력해 주세요" maxlength="6" />
            <button class="btn-sm" onclick="verifyCode('fi')">확인</button>
          </div>
        </fieldset>
        <button class="btn btn--primary" id="fi-btn" onclick="doFindId()">아이디 찾기</button>
        <div id="fi-result" style="display: none">
          <div class="result-box">
            <p class="lbl">가입된 아이디</p>
            <p class="val" id="fi-result-val"></p>
          </div>
          <button class="btn btn--primary" onclick="show('s-login')">로그인하러 가기</button>
        </div>
      </div>
    </div>

    <!-- 1. Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Supabase 클라이언트 초기화 -->
    <script>
      window.supabaseClient = window.supabase.createClient('https://vrvukirozrzyjimawrkl.supabase.co', 'sb_publishable_Vpyh0sHHSBQP0UIzPut3Yg_kfjnZ4xB')
    </script>

    <!-- 3. app.js (show, showAlert 등 함수 정의) -->
    <script src="./assets/js/app.js"></script>

    <!-- 4. OAuth 콜백 처리 - app.js 로드 이후에 실행 -->
    <script>
      window.supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
          const name = session.user.user_metadata?.full_name || session.user.user_metadata?.name || session.user.email
          if (window.location.hash.includes('access_token')) {
            history.pushState('', document.title, window.location.pathname)
          }
          show('s-login')
          showAlert('login-alert', `${name}님, 환영합니다! 로그인 성공`, 'success')
        }
      })
    </script>
  </body>
</html>
